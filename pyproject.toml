[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "faceaudit"
version = "0.1.0"
description = "Biblioteca de auditoria forense facial"
requires-python = ">=3.11"
dependencies = [
    # Core data + math
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "pyarrow",
    "tqdm",
    # Image / face — usa a versão `-headless` (sem deps de GUI nativa):
    #   - PyQt6 cuida de toda a UI; nada do código chama cv2.imshow/etc.
    #   - `forensicface` já traz `opencv-python-headless` transitivamente;
    #     declarar `opencv-python` (GUI) criava duplicata de ~230MB no
    #     site-packages e conflito potencial no namespace `cv2`.
    #   - Para empacotar o app como .exe Windows futuramente, `-headless`
    #     é o caminho oficial (sem .so de GUI que falham fora do Linux).
    "opencv-python-headless",
    # Forensic embedding backend. `FFService` (faceaudit/services/ff_service.py)
    # delega à API >= 0.6.0 — PyPI só tem até 0.4.1, então instalamos do
    # repositório upstream via git URL (PEP 508).
    # Note: o usuário ainda precisa baixar os arquivos de modelo em
    # ~/.forensicface/models/ — o pacote não distribui pesos.
    "forensicface @ git+https://github.com/rafribeiro/forensicface.git@v0.7.1",
    # Plotting (used by validation, casework, hubness widgets and
    # by generate_arch_doc.py PDF generation)
    "matplotlib",
    "seaborn",
    "statsmodels",  # required for plot_norm_vs_nk_lowess (LOWESS curve)
    # Embedding visualization (t-SNE/UMAP scatter no audit dialog).
    # Traz numba + pynndescent transitivamente — install demora ~1 min
    # da primeira vez (JIT compile na primeira chamada também leva
    # ~10s, depois cacheado).
    "umap-learn",
    # PLDA backend
    "speechbrain",
    # UI (Strategy Manager V2 + all viewer dialogs)
    "PyQt6>=6.5",
    # Architecture wiring
    "dependency-injector",
    "loguru",
    # macOS: injeta CFBundleIdentifier em runtime pra que QFileDialog
    # nativo (NSOpenPanel) funcione sem precisar empacotar como .app.
    # QTBUG-135882 — sem isso, todos os file dialogs travam
    # silenciosamente no macOS Sequoia/Tahoe + Qt 6.9.x.
    'pyobjc-framework-Cocoa; sys_platform == "darwin"',
]

[project.optional-dependencies]
# Documentation generation (PDF of architecture). Optional so the
# main install stays lighter.
docs = ["reportlab"]
# Development / testing.
dev = [
    "pytest",
    "pytest-qt",
]

[tool.setuptools.packages.find]
where = ["."]  # Ou ["src"] se você usou a pasta src